version: "3.9"

networks:
  sso-net:
    external: true
    name: sso-lab_sso-net
  dev-net:
    external: true
    name: dev-net

volumes:
  # Fichiers téléchargés par les robots : `engine` y écrit, `backend` les sert
  # puis les supprime. Volume NON externe à dessein — son contenu est transitoire
  # et `clean2.sh` peut le vider sans rien perdre d'important (à l'inverse des
  # volumes média d'app, cf. CLAUDE.md). Le stockage utilisateur persistant reste
  # du ressort de l'app `storage`, pas d'ici.
  downloads:

services:

  backend:
    build: ./backend
    container_name: robot-lab-backend
    restart: unless-stopped
    env_file: .env
    ports:
      - "8094:8000"
    volumes:
      - downloads:/downloads
    networks:
      - sso-net
      - dev-net
    labels:
      caddy: "${DOMAIN}"
      caddy.handle_path: "/robot-lab-api/*"
      caddy.handle_path.reverse_proxy: "{{upstreams 8000}}"

  frontend:
    build: ./frontend
    container_name: robot-lab-frontend
    restart: unless-stopped
    # Uniquement les variables que lit nginx-entrypoint.sh pour écrire env.js —
    # aucune n'est secrète (env.js est servi au navigateur). `env_file: .env`
    # donnait à ce conteneur nginx tous les secrets de l'app.
    environment:
      DOMAIN: ${DOMAIN:-}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-}
      KEYCLOAK_PUBLIC_URL: ${KEYCLOAK_PUBLIC_URL:-}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-}
      PORT_BACKEND: ${PORT_BACKEND:-}
      PORT_ENGINE: ${PORT_ENGINE:-}
      PORT_FRONTEND: ${PORT_FRONTEND:-}
    ports:
      - "4212:80"
    networks:
      - sso-net
    labels:
      caddy: "${DOMAIN}"
      caddy.handle_path: "/robot-lab/*"
      caddy.handle_path.reverse_proxy: "{{upstreams 80}}"

  # Moteur d'enregistrement/exécution Playwright (vue live WebSocket + CDP) —
  # Chromium isolé ici, jamais dans l'image backend (cf. CLAUDE.md, runner/).
  # Un seul navigateur à la fois (mutex interne, engine/server.js).
  engine:
    build: ./engine
    container_name: robot-lab-engine
    restart: unless-stopped
    env_file: .env
    ports:
      - "8095:4300"
    volumes:
      - downloads:/downloads
    networks:
      - sso-net
      - dev-net
    labels:
      caddy: "${DOMAIN}"
      caddy.handle_path: "/robot-lab-engine/*"
      caddy.handle_path.reverse_proxy: "{{upstreams 4300}}"
